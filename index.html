<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Affichage mobile plein écran, pas de zoom intempestif pendant le dessin -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1A4DE6">

  <title>Parterres — Relevés de massifs</title>

  <!-- Manifeste PWA : permet l'installation sur l'écran d'accueil du téléphone -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icone-192.png">

  <!-- Feuille de style (noir / blanc / bleu roi) -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Conteneur unique : l'application injecte chaque écran ici -->
  <div id="app"></div>

  <!--
    Ordre de chargement important :
    1. config   (sécurité / paramètres)
    2. storage  (base locale)
    3. sync     (synchro Google Sheets)
    4. plantes  (logique stock & couleurs)
    5. drawing  (canvas)
    6. jspdf + export (plan PDF imprimable)
    7. app      (interface, qui orchestre tout)
  -->
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/plantes.js"></script>
  <script src="js/drawing.js"></script>
  <script src="js/lib/jspdf.umd.min.js"></script>
  <script src="js/export.js"></script>
  <script src="js/kml.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
